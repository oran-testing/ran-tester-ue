services:
  controller:
    image: ghcr.io/oran-testing/controller 
    volumes:
      # Pass in the docker soket for starting rtue
      - /var/run/docker.sock:/var/run/docker.sock
      # Allow results writing to host machine
      - /tmp:/tmp
      # Allow access to system level docker configuration
      - /root/.docker:/root/.docker
      # Allow access to all configurations under the current directory
      - ${DOCKER_SYSTEM_DIRECTORY}:/host:rw
      # Allow access to /usr/share to check for images
      - /usr/share:/usr/share:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CONFIG=${DOCKER_CONTROLLER_INIT_CONFIG:-configs/basic_ue_zmq.yaml}

    privileged: true
    build:
      context: controller
    env_file:
      - .env
    networks:
      metrics:
        ipv4_address: 172.19.1.7
      control:
        ipv4_address: 172.38.1.7
    configs:
      - controller.yml
    ports:
      # WARNING: Exposes control API
      - "1343:1343"
    depends_on:
      - influxdb
    tty: true
    stdin_open: true

  zmq_relay:
    build:
      context: ./zmq_relay
      dockerfile: Dockerfile
    container_name: zmq_relay
    environment:
      - GNB_TX=tcp://172.22.0.1:5000
      - SPOOFER_TX=tcp://zmq_ssb_spoof:7000
      - UE_REP=tcp://*:5100
      - SPOOFER_RX_REP=tcp://*:5101
    networks:
      rt_zmq:
        ipv4_address: 172.22.0.10
    restart: unless-stopped

  zmq_ue_new:
    image: ghcr.io/oran-testing/rtue:latest
    container_name: zmq_ue_new
    privileged: true
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    depends_on:
      zmq_relay:
        condition: service_started
    volumes:
      - ./configs/srsran/ue_zmq_relay.conf:/ue.conf:ro
    networks:
      rt_zmq:
        ipv4_address: 172.22.0.2
    tty: true
    stdin_open: true
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp-server
    volumes:
      - ${DOCKER_SYSTEM_DIRECTORY}/configs:/host/configs:ro
    environment:
      - CONTROLLER_URL=http://controller:1343
      - CONTROLLER_TOKEN=${MCP_CONTROLLER_TOKEN}
      - CONFIGS_DIR=/host/configs
      - LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
    networks:
      - control
    depends_on:
      - controller
    stdin_open: true
    tty: true

  influxdb:
    container_name: influxdb
    image: influxdb:${DOCKER_INFLUXDB_VERSION}
    volumes:
      - influxdb-storage:/var/lib/influxdb2:rw
    env_file:
      - .env
    ports:
      - 8086:${DOCKER_INFLUXDB_INIT_PORT}
    networks:
      metrics:
        ipv4_address: 172.19.1.5

  grafana:
     image: ghcr.io/oran-testing/grafana
     build:
       context: grafana
     volumes:
       - grafana-storage:/var/lib/grafana:rw
     env_file:
       - .env
     ports:
       - 3300:${GRAFANA_PORT}
     networks:
       metrics:
         ipv4_address: 172.19.1.6
     depends_on:
       - influxdb

configs:
  controller.yml:
    file: ${DOCKER_CONTROLLER_INIT_CONFIG:-configs/multi_ue_uhd.yaml}

volumes:
  influxdb-storage:
  grafana-storage:

networks:

  metrics:
    name: rt_metrics
    ipam:
      config:
        - subnet: 172.19.1.0/24
  control:
    name: rt_control
    ipam:
      config:
        - subnet: 172.38.1.0/24
  rt_zmq:
    external: true
    name: rt_zmq
