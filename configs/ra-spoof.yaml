enable_cli: true

api_auth: 
  - name: "mcp-server"
    token: "testing_token"
    scopes:
      - "start_from_json"
      - "start"
      - "schemas/rtue"
      - "schemas/sniffer"
      - "schemas/jammer"
      - "schemas/sni5gect"
      - "list"
      - "status"
      - "stop"
      - "logs"
      - "health"
    allowed_components: ["ra_spoof", "sni5gect"]

build_spec:
  - component: "oran-testing/ra-spoof"
    branch: "main"
    pull: false

run_spec:
  - component: "oran-testing/ra-spoof"
    worker_thread: "ra_spoof"
    name: "band3_rach_flood"
    config_file: "configs/ra_spoof/generic_flood.yaml"
    rf:
      type: "b200"


