enable_cli: true

api_auth: 
  - name: "mcp-server"
    token: "testing_token"
    scopes:
      - "start_from_json"
      - "start"
      - "schemas/rtue"
      - "schemas/sniffer"
      - "schemas/jammer"
      - "schemas/sni5gect"
      - "list"
      - "status"
      - "stop"
      - "logs"
      - "health"
    allowed_components: ["rtue", "sstorm", "sni5gect"]

build_spec:
  - component: "cueltschey/sni5gect-compact"
    branch: "main"
    pull: true

  - component: "cueltschey/sstorm-rectest"
    branch: "master"
    pull: true

run_spec:
  - component: "cueltschey/sni5gect-compact"
    sleep_ms: 3000
    worker_thread: "sni5gect"
    name: "sni5gect_to_configure"
    config_file: "configs/sni5gect/srsgnb_band3.yaml"
    rf:
      type: "b200"

  - component: "cueltschey/sstorm-rectest"
    worker_thread: "sstorm"
    name: "basic_zmq_signal_storm"
    config_file: "configs/srsran/sstorm.conf"
    rf:
      type: "b200"
