enable_cli: true

api_auth: 
  - name: "mcp-server"
    token: "testing_token"
    scopes:
      - "start_from_json"
      - "start"
      - "schemas/rtue"
      - "schemas/sniffer"
      - "schemas/jammer"
      - "schemas/sni5gect"
      - "list"
      - "status"
      - "stop"
      - "logs"
      - "health"
    allowed_components: ["sni5gect"]

build_spec:
  - component: "cueltschey/sni5gect-compact"
    branch: "main"
    pull: false

run_spec:
  - component: "cueltschey/sni5gect-compact"
    worker_thread: "sni5gect"
    name: "sni5gect_scan_band3"
    config_file: "configs/sni5gect/srsgnb_band3.yaml"
    rf:
      type: "b200"
