enable_cli: true

api_auth:
  - name: "mcp-server"
    token: "default_changeme"
    scopes:
      - "start_from_json"
      - "schemas/rtue"
      - "schemas/sniffer"
      - "schemas/jammer"
      - "schemas/sni5gect"
      - "components"
      - "status"
      - "stop"
      - "logs"
    allowed_components: ["rtue", "sniffer", "jammer", "sni5gect", "ssb_spoofer", "uuagent"]

build_spec:
  - component: "cueltschey/sni5gect-compact"
    branch: "iq_file"
    pull: true

  - component: "oran-testing/rtue"
    branch: "main"
    pull: true

run_spec:
  - component: "cueltschey/sni5gect-compact"
    worker_thread: "sni5gect"
    name: "sniffer_test_01"
    config_file: "configs/sni5gect/srsgnb_band3.yaml"
    rf:
      type: "b200"

  - component: "oran-testing/rtue"
    worker_thread: "rtue"
    name: "test_ue"
    config_file: "configs/srsran/ue_uhd.conf"
    rf:
      type: "b200"
