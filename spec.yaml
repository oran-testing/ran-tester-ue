enable_cli: true

api_auth: 
  - name: "mcp-server"
    token: "testing_token"
    scopes:
      - "start_from_json"
      - "start"
      - "schemas/rtue"
      - "schemas/sniffer"
      - "schemas/jammer"
      - "schemas/sni5gect"
      - "list"
      - "status"
      - "stop"
      - "logs"
      - "health"
    allowed_components: ["rtue", "sniffer", "jammer", "sni5gect", "ssb_spoofer", "uuagent"]

build_spec:
  - component: "oran-testing/llm_worker"
    branch: "main"
    pull: false

  - component: "oran-testing/ra-spoof"
    branch: "main"
    pull: true

run_spec:
  - component: "oran-testing/rtue"
    worker_thread: "rtue"
    name: "rtue_test"
    config_file: "configs/srsran/ue_uhd.conf"
    rf:
      type: "b200"

  - component: "oran-testing/ra-spoof"
    sleep_ms: 3000
    worker_thread: "ra_spoof"
    name: "rach_spoofer"
    config_file: "configs/ra_spoof/config.yaml"
    rf:
        type: "b200"

