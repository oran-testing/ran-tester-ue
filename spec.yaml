enable_cli: false

api_auth: 
  - name: "mcp-server"
    token: "testing_token"
    scopes:
      - "start_from_json"
      - "start"
      - "schemas/rtue"
      - "schemas/sniffer"
      - "schemas/jammer"
      - "schemas/sni5gect"
      - "list"
      - "status"
      - "stop"
      - "logs"
      - "health"
    allowed_components: ["rtue", "sniffer", "jammer", "sni5gect", "ssb_spoofer", "uuagent"]

build_spec:
  - component: "cueltschey/sni5gect-compact"
    branch: "iq_file"
    pull: true

  - component: "oran-testing/ssb-spoofer"
    branch: "autoconfiguration"
    pull: true

  - component: "oran-testing/rtue"
    branch: "main"
    pull: false
    dockerfile: "dockerfiles/Dockerfile.rtue"


run_spec:
  #- component: "cueltschey/sni5gect-compact"
  #  name: "sni5gect_iq_file"
  #  config_file: "configs/sni5gect/basic_file_test.yaml"
  #  rf:
  #    type: "none"

  - component: "oran-testing/ssb-spoofer"
    name: "zmq_ssb_spoof"
    config_file: "configs/ssb_spoofer/zmq_relay.yaml"
    rf:
      type: "zmq"
      tcp_subnet: "172.22.0.0/24"
      gateway: "172.22.0.1"

  - component: "oran-testing/rtue"
    name: "zmq_ue"
    config_file: "configs/srsran/ue_zmq_docker.conf"
    rf:
      type: "zmq"
      tcp_subnet: "172.22.0.0/24"
      gateway: "172.22.0.1"
    sleep_ms: 3000

