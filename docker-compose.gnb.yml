version: "3.8"

services:
  5gc:
    image: docker-5gc:latest
    container_name: open5gs_5gc
    privileged: true
    env_file:
      - /home/goober/srsRAN_Project/docker/open5gs/open5gs.env
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 30
    networks:
      ran:
        ipv4_address: 10.53.1.2

  gnb:
    image: gnb-test
    container_name: srsran_gnb
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    ports:
      - "5000:5000"  # ZMQ TX port
      - "6000:6000"  # ZMQ RX port
    depends_on:
      5gc:
        condition: service_healthy
    volumes:
      - ./configs/srsran/gnb_zmq_relay.yaml:/gnb_config.yaml:ro
    command: ["gnb", "-c", "/gnb_config.yaml"]
    networks:
      ran:
        ipv4_address: 10.53.1.3
      rt_zmq:
        ipv4_address: 172.22.0.1
    tty: true
    stdin_open: true

  zmq_relay:
    build:
      context: ./zmq_relay
      dockerfile: Dockerfile
    container_name: zmq_relay
    depends_on:
      - gnb
    networks:
      rt_zmq:
        ipv4_address: 172.22.0.10
    restart: unless-stopped

  zmq_ue:
    image: sstorm-ue:latest
    container_name: zmq_ue
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_NET_ADMIN
    depends_on:
      zmq_relay:
        condition: service_started
    networks:
      rt_zmq:
        ipv4_address: 172.22.0.2
    volumes:
      - ./configs/srsran/ue_zmq_relay.conf:/ue.conf:ro
    command: ["sh", "-c", "/usr/local/bin/srsue /ue.conf"]
    tty: true
    stdin_open: true

networks:
  ran:
    driver: bridge
    name: srsran_ran
    ipam:
      config:
        - subnet: 10.53.1.0/24
  rt_zmq:
    external: true
    name: rt_zmq